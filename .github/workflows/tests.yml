name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The target is a public site; a nightly run surfaces its drift.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  # Lint and formatting are their OWN job, not steps inside the test job.
  #
  # They need no browser, no network and no secrets, and they finish in
  # seconds. As a separate job they run concurrently with the suite, so a
  # style failure does not wait behind a ten-minute browser run and a test
  # failure is not hidden behind a style failure. Both verdicts arrive on
  # their own.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      # `--check`, never `--write`: CI reports, it does not silently rewrite
      # the branch it was asked to verify.
      - name: Prettier
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      # cypress-io/github-action handles the binary cache, which is the slow
      # part of a cold Cypress run.
      - name: Run suite
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: npm test
      # `!cancelled()` rather than `always()` or `failure()`: a report of a
      # green run is what you compare the next red one against, and uploading
      # it on cancellation only stores a truncated file.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: junit-report
          path: reports/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7
