name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The target is a public site; a nightly run surfaces its drift.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      # cypress-io/github-action handles the binary cache, which is the slow
      # part of a cold Cypress run.
      - name: Run suite
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7
